<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · Prochains bus</title>
  <style>
    :root { --bg:#0f1115; --card:#1a1d24; --fg:#f2f4f8; --muted:#8a92a3; --accent:#ffcc00; --err:#ff6b6b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
    form { background:var(--card); border-radius:18px; padding:28px; width:min(380px,100%); display:grid; gap:14px; }
    h1 { margin:0; font-size:24px; }
    p { margin:0; color:var(--muted); }
    input { font:inherit; font-size:24px; padding:12px 14px; border-radius:10px; border:2px solid #333a46; background:#0b0d11; color:var(--fg); width:100%; }
    input:focus { outline:none; border-color:var(--accent); }
    button { font:inherit; font-size:20px; font-weight:700; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#000; cursor:pointer; }
    #err { color:var(--err); min-height:1.2em; }
  </style>
</head>
<body>
  <form method="post" id="f">
    <h1>Prochains bus</h1>
    <p>Entrez le mot de passe</p>
    <input type="password" name="password" autofocus autocomplete="current-password" required>
    <div id="err"></div>
    <button>Entrer</button>
  </form>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('f').action = '/login?next=' + encodeURIComponent(q.get('next') || '/');
    const e = q.get('error');
    document.getElementById('err').textContent =
      e === 'bad' ? 'Mot de passe incorrect' : e === 'locked' ? 'Trop d’essais, réessayez dans 5 minutes' : '';
  </script>
</body>
</html>
